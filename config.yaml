# Configuração da coleta de tweets — Termômetro Eleitoral 2026.
#
# Edite livremente: troque candidatos, adicione/remova aliases, ajuste
# parâmetros de coleta. O script src/collect.py lê este arquivo e itera.

collection:
  # Tweets-alvo por candidato. O X tem rate limit de 50 chamadas / 15 min
  # no endpoint de busca, e cada chamada retorna até 20 tweets — então
  # 200 por candidato é seguro pra ~12 candidatos numa janela.
  tweets_per_candidate: 200

  # Idioma incluído na query (operador `lang:` do X).
  language: pt

  # Modo da busca: Latest (cronológico) | Top (ranqueado) | Media.
  product: Latest

  # Data mínima dos tweets (formato YYYY-MM-DD). Comente pra desativar.
  since: 2026-01-01

  # Pausa entre páginas/candidatos pra suavizar rate limit (segundos).
  rate_limit_sleep_seconds: 5

  # Caminho do CSV de saída (relativo à raiz do projeto).
  output_csv: data/raw/tweets.csv

  # Caminho onde os cookies de sessão são persistidos.
  cookies_file: .twikit_cookies.json

# Lista de candidatos. Os handles são chutes razoáveis — verifique e ajuste
# antes de rodar. O `name` é o nome canônico (chave do CSV).
candidates:
